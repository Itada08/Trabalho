<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NFT Preview Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <article class="card">
      <a href="#" class="card__image" aria-label="View Equilibrium #3429">
        <img src="images/image-equilibrium.jpg" alt="Equilibrium NFT artwork" />
        <span class="card__overlay">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="#fff" aria-hidden="true">
            <path d="M12 5C6 5 2 12 2 12s4 7 10 7 10-7 10-7-4-7-10-7Zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8Zm0-6a2 2 0 1 0 0 4 2 2 0 0 0 0-4Z"/>
          </svg>
        </span>
      </a>

      <h1 class="card__title"><a href="#">Equilibrium #3429</a></h1>
      <p class="card__text">Our Equilibrium collection promotes balance and calm.</p>

      <div class="card__info">
        <span class="card__price">
          <svg width="10" height="16" viewBox="0 0 10 16" fill="#00ffff" aria-hidden="true">
            <path d="M5 0 0 8l5 3 5-3L5 0Zm0 12.3L0 9.3 5 16l5-6.7-5 3Z"/>
          </svg>
          0.041 ETH
        </span>
        <span class="card__time">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="#8bacd9" aria-hidden="true">
            <path d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm1 11H7v-2h4V6h2v7Z"/>
          </svg>
          3 days left
        </span>
      </div>

      <hr />

      <div class="card__author">
        <img src="images/image-avatar.png" alt="Avatar of Jules Wyvern" />
        <p>Creation of <a href="#">Jules Wyvern</a></p>
      </div>
    </article>
  </main>
</body>
</html>
